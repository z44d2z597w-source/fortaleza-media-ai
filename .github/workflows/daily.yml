name: FORTALEZA MEDIA AI
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar en Redes (true/false)'
        required: false
        default: false
        type: boolean
  schedule:
    # 15:00 UTC = 9:00 AM CDMX (San Luis Potosí)
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Generar Videos (Short y Largo)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: Guardar memoria creativa
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f historial_creativo.json ] && git add historial_creativo.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Auto-mejora: Historial actualizado [skip ci]"
          git push

      - name: Preparar metadatos
        run: |
          python - <<'PY'
          import json, os
          with open("guion.json", encoding="utf-8") as f: g = json.load(f)
          
          titulo_largo = " ".join(g["titulo"].split())[:100]
          storyboard = g.get("director_notes", {}).get("storyboard", [])
          texto_largo = " ".join(beat["narracion"] for beat in storyboard)
          desc_largo = texto_largo[:4000] + " #Documental #Historia #Misterio"
          
          titulo_short = titulo_largo + " #Shorts"
          desc_short = g["gancho_corto"] + " #Shorts #Viral #TikTok"
          
          delim = "FORTALEZA_" + str(os.getpid())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VIDEO_TITLE_LARGO<<{delim}\n{titulo_largo}\n{delim}\n")
              f.write(f"VIDEO_DESC_LARGO<<{delim}\n{desc_largo}\n{delim}\n")
              f.write(f"VIDEO_TITLE_SHORT<<{delim}\n{titulo_short}\n{delim}\n")
              f.write(f"VIDEO_DESC_SHORT<<{delim}\n{desc_short}\n{delim}\n")
          PY

      - name: Subir artefactos (Videos para TikTok)
        uses: actions/upload-artifact@v4
        with:
          name: VIDEOS-PARA-REDES
          path: |
            output/fortaleza_short.mp4
            output/fortaleza_largo.mp4
          retention-days: 7

      - name: Publicar Video Largo en YouTube
        if: |
          github.event_name == 'schedule' || 
          github.event.inputs.publicar == 'true' || 
          github.event.inputs.publicar == true
        env:
          FORTALEZA_UPLOAD_KEY: ${{ secrets.FORTALEZA_UPLOAD_KEY }}
          VIDEO_TITLE: ${{ env.VIDEO_TITLE_LARGO }}
          VIDEO_DESCRIPTION: ${{ env.VIDEO_DESC_LARGO }}
        run: |
          set -e
          VIDEO="output/fortaleza_largo.mp4"
          if [ ! -s "$VIDEO" ]; then echo "No hay video largo, saltando."; exit 0; fi
          curl -sS -f -X POST "https://fortaleza-youtube-auth.z44d2z597w.workers.dev/publicar" \
            -H "X-Fortaleza-Key: ${FORTALEZA_UPLOAD_KEY}" -H "Content-Type: video/mp4" \
            -H "X-Video-Title: ${VIDEO_TITLE}" -H "X-Video-Description: ${VIDEO_DESCRIPTION}" \
            --data-binary "@${VIDEO}"

      - name: Publicar Short en YouTube
        if: |
          github.event_name == 'schedule' || 
          github.event.inputs.publicar == 'true' || 
          github.event.inputs.publicar == true
        env:
          FORTALEZA_UPLOAD_KEY: ${{ secrets.FORTALEZA_UPLOAD_KEY }}
          VIDEO_TITLE: ${{ env.VIDEO_TITLE_SHORT }}
          VIDEO_DESCRIPTION: ${{ env.VIDEO_DESC_SHORT }}
        run: |
          set -e
          VIDEO="output/fortaleza_short.mp4"
          if [ ! -s "$VIDEO" ]; then echo "No hay short, saltando."; exit 0; fi
          curl -sS -f -X POST "https://fortaleza-youtube-auth.z44d2z597w.workers.dev/publicar" \
            -H "X-Fortaleza-Key: ${FORTALEZA_UPLOAD_KEY}" -H "Content-Type: video/mp4" \
            -H "X-Video-Title: ${VIDEO_TITLE}" -H "X-Video-Description: ${VIDEO_DESCRIPTION}" \
            --data-binary "@${VIDEO}"