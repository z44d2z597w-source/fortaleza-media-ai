name: FORTALEZA MEDIA AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

jobs:
  producir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar video
        run: python main.py

      - name: Guardar video
        uses: actions/upload-artifact@v4
        with:
          name: FORTALEZA-MEDIA-VIDEO
          path: output/fortaleza_short.mp4
          retention-days: 7