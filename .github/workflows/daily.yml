name: FORTALEZA MEDIA AI
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar en YouTube (true/false)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Generar Video (Capítulo del Día)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: Guardar Memoria y Progreso
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f historial_creativo.json ] && git add historial_creativo.json
          [ -f estado_serie.json ] && git add estado_serie.json
          [ -f guion_serie.json ] && git add guion_serie.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Auto-mejora: Progreso de serie actualizado [skip ci]"
          git push

      - name: Preparar Metadatos
        run: |
          python - <<'PY'
          import json, os
          with open("guion.json", encoding="utf-8") as f: 
              g = json.load(f)
          
          titulo = f"{g['titulo_serie']} - Parte {g['parte']}"
          desc = g["narracion"][:200] + " #Shorts #Misterio #Serie"
          
          delim = "FORTALEZA_" + str(os.getpid())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VIDEO_TITLE<<{delim}\n{titulo}\n{delim}\n")
              f.write(f"VIDEO_DESC<<{delim}\n{desc}\n{delim}\n")
          PY

      - name: Subir Artefacto (Para TikTok)
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO-DEL-DIA
          path: output/fortaleza_short.mp4
          retention-days: 7

      - name: Publicar en YouTube Shorts
        if: |
          github.event_name == 'schedule' || 
          github.event.inputs.publicar == 'true' || 
          github.event.inputs.publicar == true
        env:
          FORTALEZA_UPLOAD_KEY: ${{ secrets.FORTALEZA_UPLOAD_KEY }}
          VIDEO_TITLE: ${{ env.VIDEO_TITLE }}
          VIDEO_DESCRIPTION: ${{ env.VIDEO_DESC }}
        run: |
          set -e
          VIDEO="output/fortaleza_short.mp4"
          if [ ! -s "$VIDEO" ]; then echo "No hay video, saltando."; exit 0; fi
          curl -sS -f -X POST "https://fortaleza-youtube-auth.z44d2z597w.workers.dev/publicar" \
            -H "X-Fortaleza-Key: ${FORTALEZA_UPLOAD_KEY}" -H "Content-Type: video/mp4" \
            -H "X-Video-Title: ${VIDEO_TITLE}" -H "X-Video-Description: ${VIDEO_DESCRIPTION}" \
            --data-binary "@${VIDEO}"