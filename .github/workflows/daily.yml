
name: FORTALEZA MEDIA AI - SHORTS AUTOMATICOS

on:
  workflow_dispatch:

  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: fortaleza-media-ai
  cancel-in-progress: false

jobs:
  generar_y_publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restaurar historial
        uses: actions/cache@v4
        with:
          path: |
            historial.json
            fondos_usados.json
          key: fortaleza-historial-${{ github.run_id }}
          restore-keys: |
            fortaleza-historial-

      - name: Generar Short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: Guardar historial
        if: success()
        run: |
          git config user.name "Fortaleza Media AI"
          git config user.email "actions@github.com"
          git add historial.json fondos_usados.json
          git diff --cached --quiet || git commit -m "Actualizar historial"
          git push

      - name: Guardar video generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortaleza-media-ai-video
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar automáticamente en YouTube
        if: success()
        env:
          FORTALEZA_UPLOAD_KEY: ${{ secrets.FORTALEZA_UPLOAD_KEY }}
          WORKER_URL: https://fortaleza-youtube-auth.z44d2z597w.workers.dev
        run: |
          set -euo pipefail

          VIDEO=$(find output -maxdepth 1 -type f -name '*.mp4' | head -n 1)

          if [ -z "$VIDEO" ]; then
            echo "ERROR: No se encontró el video."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")
          MAX_SIZE=$((90 * 1024 * 1024))

          if [ "$SIZE" -le 0 ] || [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: Tamaño de video inválido o superior a 90 MB."
            exit 1
          fi

          if [ -z "$FORTALEZA_UPLOAD_KEY" ]; then
            echo "ERROR: Falta FORTALEZA_UPLOAD_KEY."
            exit 1
          fi

          TITLE=$(python -c "import json; print(json.load(open('temp/guion_actual.json', encoding='utf-8'))['titulo'].replace('\n',' ').strip()[:100])")

          DESCRIPTION=$(python -c "import json; g=json.load(open('temp/guion_actual.json', encoding='utf-8')); print(' '.join(g['narracion'].split())[:4400] + ' #Shorts #Historias #FortalezaMediaAI')")

          echo "Publicando automáticamente: $TITLE"

          RESPONSE=$(curl --fail-with-body --show-error --silent \
            -X POST "$WORKER_URL/publicar" \
            -H "Content-Type: video/mp4" \
            -H "X-Fortaleza-Key: $FORTALEZA_UPLOAD_KEY" \
            -H "X-Video-Title: $TITLE" \
            -H "X-Video-Description: $DESCRIPTION" \
            --data-binary "@$VIDEO")

          echo "$RESPONSE"

          echo "$RESPONSE" | python -c "import json,sys; r=json.load(sys.stdin); assert r.get('success') is True, r.get('error', 'Publicación no confirmada'); print('PUBLICADO:', r.get('url'))"
