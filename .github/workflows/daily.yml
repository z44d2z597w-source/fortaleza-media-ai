
name: FORTALEZA MEDIA AI - SHORTS AUTOMATICOS

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar en YouTube automáticamente"
        required: false
        type: boolean
        default: true

  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: fortaleza-media-ai
  cancel-in-progress: false

jobs:
  generar_y_publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar herramientas
        run: |
          python --version
          ffmpeg -version
          ffprobe -version

      - name: Generar Short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: Verificar video generado
        run: |
          set -euo pipefail

          VIDEO=$(find output -maxdepth 1 -type f -name '*.mp4' | head -n 1)

          if [ -z "$VIDEO" ]; then
            echo "ERROR: No se encontró ningún video."
            exit 1
          fi

          if [ ! -s "$VIDEO" ]; then
            echo "ERROR: El video está vacío."
            exit 1
          fi

          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"
          echo "Video encontrado: $VIDEO"
          ls -lh "$VIDEO"

      - name: Preparar metadatos
        run: |
          python - <<'PY'
          import json
          import os

          with open(
              "temp/guion_actual.json",
              encoding="utf-8"
          ) as archivo:
              guion = json.load(archivo)

          titulo = " ".join(
              str(guion.get("titulo", "Fortaleza Media AI")).split()
          )[:100]

          descripcion = " ".join(
              str(guion.get("narracion", "")).split()
          )[:400]

          descripcion += " #Shorts #Historias #FortalezaMediaAI"

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as archivo:
              archivo.write(f"VIDEO_TITLE={titulo}\n")
              archivo.write(f"VIDEO_DESCRIPTION={descripcion}\n")
          PY

      - name: Guardar historial
        if: success()
        run: |
          set -e

          git config user.name "Fortaleza Media AI"
          git config user.email "actions@github.com"

          for archivo in historial.json fondos_usados.json; do
            if [ -f "$archivo" ]; then
              git add "$archivo"
            fi
          done

          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
          else
            git commit -m "Actualizar historial de Shorts [skip ci]"
            git push
          fi

      - name: Guardar video generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FORTALEZA-MEDIA-AI-SHORT
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar automáticamente en YouTube
        if: success() && (github.event_name == 'schedule' || inputs.publicar)
        env:
          FORTALEZA_UPLOAD_KEY: ${{ secrets.FORTALEZA_UPLOAD_KEY }}
          WORKER_URL: https://fortaleza-youtube-auth.z44d2z597w.workers.dev
        run: |
          set -euo pipefail

          if [ -z "${FORTALEZA_UPLOAD_KEY:-}" ]; then
            echo "ERROR: Falta el secreto FORTALEZA_UPLOAD_KEY."
            exit 1
          fi

          if [ ! -s "$VIDEO" ]; then
            echo "ERROR: No existe el video para publicar."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")
          MAX_SIZE=$((90 * 1024 * 1024))

          if [ "$SIZE" -le 0 ] || [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: El video supera el límite de 90 MB o está vacío."
            exit 1
          fi

          echo "Publicando: $VIDEO"
          echo "Título: $VIDEO_TITLE"

          RESPONSE=$(curl --fail-with-body --show-error --silent \
            -X POST "$WORKER_URL/publicar" \
            -H "Content-Type: video/mp4" \
            -H "X-Fortaleza-Key: $FORTALEZA_UPLOAD_KEY" \
            -H "X-Video-Title: $VIDEO_TITLE" \
            -H "X-Video-Description: $VIDEO_DESCRIPTION" \
            --data-binary "@$VIDEO")

          echo "$RESPONSE"

          echo "$RESPONSE" | python -c "
          import json, sys
          respuesta = json.load(sys.stdin)
          assert respuesta.get('success') is True, respuesta.get('error', 'Publicación no confirmada')
          print('PUBLICACIÓN CONFIRMADA')
          print(respuesta.get('url', ''))
          "
