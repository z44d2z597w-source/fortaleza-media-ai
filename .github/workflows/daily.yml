name: FORTALEZA MEDIA AI - SHORTS DIARIOS

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar automáticamente en YouTube"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: fortaleza-media-ai
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restaurar historial
        uses: actions/cache@v4
        with:
          path: |
            historial.json
            fondos_usados.json
          key: fortaleza-historial-${{ github.run_id }}
          restore-keys: |
            fortaleza-historial-

      - name: Generar Short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python main.py

      - name: Guardar historial
        if: success()
        run: |
          git config user.name "Fortaleza Media AI"
          git config user.email "actions@github.com"
          git add historial.json fondos_usados.json
          git diff --cached --quiet || git commit -m "Actualizar historial de generación"
          git push

      - name: Guardar video generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortaleza-media-ai-video
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar en YouTube
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar == true }}
        env:
          FORTALEZA_UPLOAD_KEY: ${{ secrets.FORTALEZA_UPLOAD_KEY }}
        run: |
          echo "La publicación automática debe configurarse y probarse con el Worker antes de activarla."
          echo "No se ha enviado el video para evitar publicaciones incorrectas."